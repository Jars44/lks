<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOMBSKUY</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Loading Screen Overlay -->
    <section id="loading-overlay" style="display: none">
      <div class="loading-popup">
        <div class="loading-content">
          <div class="loading-spinner"></div>
          <h2 class="loading-text">Loading Game...</h2>
          <div class="countdown">3</div>
        </div>
      </div>
    </section>

    <!-- Home Section -->
    <section id="home" style="display: none">
      <div class="form-container">
        <img src="Images/logo.png" alt="logo" class="logo-root" />
        <form class="form">
          <div class="form-input">
            <input class="input-username" type="text" placeholder="Input Username" id="username" required />
            <div class="button-form">
              <button type="submit" class="button-root" id="button-play" disabled>Play Game</button>
              <button type="button" class="button-root" id="button-instruction" onclick="Instruction()">
                Instruction
              </button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <!-- Difficulty Section -->
    <section id="difficulty-screen" style="display: none">
      <div class="form-container">
        <h2 class="difficulty-title">Select Difficulty</h2>
        <div class="difficulty-buttons">
          <button type="button" class="button-root" onclick="selectDifficulty(1)">Easy</button>
          <button type="button" class="button-root" onclick="selectDifficulty(2)">Medium</button>
          <button type="button" class="button-root" onclick="selectDifficulty(3)">Hard</button>
        </div>
      </div>
    </section>

    <!-- Pause Overlay -->
    <section id="pause-overlay" style="display: none">
      <div class="pause-container">
        <h1 class="pause-title">Game Paused</h1>
        <p class="pause-subtitle">Press ESC to resume</p>
        <div class="pause-buttons">
          <button class="pause-button" onclick="resumeGame()">Continue</button>
          <button class="pause-button" onclick="goToHome()">Main Menu</button>
        </div>
      </div>
    </section>

    <!-- Instruction Section -->
    <section id="instruction" style="display: none">
      <div class="container-instruction">
        <div class="container-text-instruction">
          <h1>How to play game</h1>
          <p>1. Input Username</p>
          <p>2. Put the bomb</p>
          <p>3. Blow up as many walls as possible</p>
          <p>4. Blow up enemies</p>
          <p>5. Enjoy!</p>
        </div>
        <button class="cross-instruction" id="cross-instruction" onclick="CloseInstruction()">&#10799;</button>
      </div>
    </section>

    <!-- Game Section  -->
    <section id="game" style="display: none">
      <div class="container-game">
        <button class="pause-game-button" onclick="pauseGame()" title="Press ESC to pause">&#10073;&#10073;</button>
        <div class="bg-wrap">
          <div class="grid-container">
            <div class="grid-item" id="tile-1"></div>
            <div class="grid-item" id="tile-2"></div>

        </div>
        <div class="stats">
          <img src="Images/logo_white.png" alt="" class="logo-game" />
          <div class="stat">
            <p class="name">Player<span id="nickname"></span></p>
            <p class="time">Time<span id="time"></span></p>
          </div>
          <img src="Images/heart_indicator.png" alt="health indicator" class="heart-indicator" />
          <div class="container-stats">
            <div class="wall-score">
              <img src="Images/wall_crack.png" alt="wall_crack" id="wall-crack-1" class="game-images" />
              <h2 id="walls">= 0</h2>
            </div>
            <div class="tnt-score">
              <img src="Images/tnt.png" alt="tnt" id="tnt-1" class="game-images" />
              <h2 id="tnt">= 0</h2>
            </div>
            <div class="ice-score">
              <img src="Images/ice.png" alt="ice" id="ice-1" class="game-images" />
              <h2 id="ice">= 0</h2>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Game Over Section -->
    <section id="gameover" style="display: none">
      <div class="container-gameover">
        <h1 class="title-gameover">Game Over!</h1>
        <h2 class="subtitle-gameover"></h2>
        <h2 class="score-gameover" id="gameover-score"></h2>
        <div class="stats-gameover">
          <img src="Images/wall_crack.png" alt="wall_crack" id="wall-crack-gameover" class="gameover-images" />
          <h2 id="gameover-walls">= 0</h2>
          <img src="Images/tnt.png" alt="tnt" id="tnt-gameover" class="gameover-images" />
          <h2 id="gameover-tnt">= 0</h2>
          <img src="Images/ice.png" alt="ice" id="ice-gameover" class="gameover-images" />
          <h2 id="gameover-ice">= 0</h2>
        </div>
        <div class="buttons-gameover">
          <button class="save-gameover" onclick="saveScore()">Save Score</button>
          <button class="leaderboard-gameover" onclick="leaderboard()">Leaderboards</button>
        </div>
      </div>
    </section>

    <!-- Leaderboard Section -->
    <section id="leaderboard" style="display: none">
      <div class="container-leaderboard">
        <h1 style="font-size: 4rem">Leaderboards</h1>
        <div class="table-container">
          <table class="table-leaderboard">
            <thead>
              <tr>
                <th style="text-align: left">Player Name</th>
                <th>Time</th>
                <th>
                  <img src="Images/wall_crack.png" alt="wall_crack" class="image-leaderboard" />
                </th>
                <th>
                  <img src="Images/tnt.png" alt="tnt" class="image-leaderboard" />
                </th>
                <th>
                  <img src="Images/ice.png" alt="ice" class="image-leaderboard" />
                </th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
        <div class="button-leaderboard">
          <button class="play-leaderboard" onclick="playAgain()">Play Again</button>
          <button class="reset-leaderboard" onclick="resetLeaderboard()">Reset</button>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
