<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOMSKUY</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <img src="../Images/logo.png" alt="logo" />
        <form action="" class="form">
          <div class="form-input">
            <input class="input" type="text" placeholder="Input Username" />
            <select id="level" class="input" required>
              <option class="input" value="level" disabled selected hidden>Select Level</option>
              <option class="option" value="1">Level 1</option>
              <option class="option" value="2">Level 2</option>
              <option class="option" value="3">Level 3</option>
            </select>
            <div class="button-form">
              <button class="button">Play</button>
              <button class="button">Instruction</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
