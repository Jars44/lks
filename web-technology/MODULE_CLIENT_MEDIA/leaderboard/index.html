<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 style="font-size: 4rem;">Leaderboards</h1>
      <div class="table-container">
        <table>
          <tr>
            <th style="text-align: left">Player Name</th>
            <th>Time</th>
            <th>
              <img src="/web-technology/MODULE_CLIENT_MEDIA/Images/wall_crack.png" alt="wall_crack" class="image"/>
            </th>
            <th>
              <img src="/web-technology/MODULE_CLIENT_MEDIA/Images/tnt.png" alt="tnt" class="image"/>
            </th>
            <th>
              <img src="/web-technology/MODULE_CLIENT_MEDIA/Images/ice.png" alt="ice" class="image"/>
            </th>
          </tr>
            <tr>
              <td>David</td>
              <td class="stat">05:30</td>
              <td class="stats">9</td>
              <td class="stats">1</td>
              <td class="stats">1</td>
            </tr>
            <tr class="row-mid">
              <td>Joni</td>
              <td class="stat">01:20</td>
              <td class="stats">4</td>
              <td class="stats">0</td>
              <td class="stats">1</td>
            </tr>
            <tr class="row">
              <td>Hikmat</td>
              <td class="stat">00:50</td>
              <td class="stats">1</td>
              <td class="stats">2</td>
              <td class="stats">0</td>
            </tr>
          </div>
        </table>
        <div class="button">
          <button class="play">Play Again</button>
          <button class="reset">Reset</button>
        </div>
      </div>
    </div>
  </body>
</html>
