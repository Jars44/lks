<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gameover</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Game Over!</h1>
      <h2 class="subtitle">Good job David! Your time 01:22 with result:</h2>
      <div class="stats">
        <img
          src="/web-technology/MODULE_CLIENT_MEDIA/Images/wall_crack.png"
          alt="wall_crack"
          id="wall-crack"
          class="gameover-images"
        />
        <h2>= 4</h2>
        <img src="/web-technology/MODULE_CLIENT_MEDIA/Images/tnt.png" alt="tnt" id="tnt" class="gameover-images" />
        <h2>= 0</h2>
        <img src="/web-technology/MODULE_CLIENT_MEDIA/Images/ice.png" alt="ice" id="ice" class="gameover-images" />
        <h2>= 1</h2>
      </div>
      <div class="buttons">
        <button class="save">Save Score</button>
        <button class="leaderboard" onclick="document.location='/web-technology/MODULE_CLIENT_MEDIA/leaderboard'">
          Leaderboard
        </button>
      </div>
    </div>
  </body>
</html>
